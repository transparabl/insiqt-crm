<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0F1F3D"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <!-- Grid pattern -->
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="315" rx="480" ry="300" fill="url(#glow)"/>

  <!-- Decorative accent bar -->
  <rect x="80" y="260" width="6" height="110" rx="3" fill="url(#accentGrad)"/>

  <!-- Logo -->
  <text x="100" y="235" font-family="Inter,system-ui,sans-serif" font-size="52" font-weight="700" fill="#F8FAFC" letter-spacing="-1">Insiqt</text>
  <text x="330" y="235" font-family="Inter,system-ui,sans-serif" font-size="52" font-weight="700" fill="#2563EB" letter-spacing="-1">.ai</text>

  <!-- Tagline -->
  <text x="100" y="295" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="400" fill="#94A3B8" letter-spacing="0.5">Intelligence for Every Industry</text>

  <!-- Main headline -->
  <text x="100" y="380" font-family="Inter,system-ui,sans-serif" font-size="56" font-weight="700" fill="#F8FAFC" letter-spacing="-1.5">Koble data.</text>
  <text x="100" y="450" font-family="Inter,system-ui,sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5">
    <tspan fill="#2563EB">Automatiser.</tspan>
    <tspan fill="#06B6D4"> Handle.</tspan>
  </text>

  <!-- Pill badges -->
  <rect x="100" y="500" width="200" height="40" rx="20" fill="rgba(37,99,235,0.12)" stroke="rgba(37,99,235,0.3)" stroke-width="1"/>
  <text x="200" y="525" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="600" fill="#93C5FD" text-anchor="middle">Transport &amp; Logistikk</text>

  <rect x="316" y="500" width="170" height="40" rx="20" fill="rgba(6,182,212,0.1)" stroke="rgba(6,182,212,0.25)" stroke-width="1"/>
  <text x="401" y="525" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="600" fill="#67E8F9" text-anchor="middle">Bygg &amp; Anlegg</text>

  <rect x="500" y="500" width="120" height="40" rx="20" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <text x="560" y="525" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="600" fill="#6EE7B7" text-anchor="middle">+ Mer</text>

  <!-- Right side: mini dashboard mockup -->
  <rect x="720" y="80" width="420" height="470" rx="16" fill="rgba(30,41,59,0.9)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Browser bar -->
  <rect x="720" y="80" width="420" height="44" rx="16" fill="#0F172A"/>
  <rect x="720" y="108" width="420" height="16" fill="#0F172A"/>
  <circle cx="748" cy="102" r="6" fill="#EF4444" opacity="0.7"/>
  <circle cx="766" cy="102" r="6" fill="#F59E0B" opacity="0.7"/>
  <circle cx="784" cy="102" r="6" fill="#10B981" opacity="0.7"/>
  <rect x="806" y="95" width="200" height="14" rx="4" fill="rgba(255,255,255,0.06)"/>
  <text x="906" y="106" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#64748B" text-anchor="middle">app.insiqt.ai</text>

  <!-- Metric cards -->
  <rect x="736" y="142" width="90" height="56" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="746" y="160" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#64748B">INNTEKTER</text>
  <text x="746" y="180" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="700" fill="#2563EB">4,2M</text>
  <text x="746" y="193" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#10B981">↑ 12,4%</text>

  <rect x="836" y="142" width="90" height="56" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="846" y="160" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#64748B">ENHETER</text>
  <text x="846" y="180" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="700" fill="#10B981">847</text>
  <text x="846" y="193" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#10B981">↑ 98,2%</text>

  <rect x="936" y="142" width="90" height="56" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="946" y="160" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#64748B">CO₂ TONN</text>
  <text x="946" y="180" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="700" fill="#06B6D4">142</text>
  <text x="946" y="193" font-family="Inter,system-ui,sans-serif" font-size="8" fill="#10B981">↓ 8,3%</text>

  <!-- Chart area -->
  <rect x="736" y="210" width="290" height="120" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="748" y="228" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#64748B">Inntektsutvikling</text>
  <polyline points="748,308 788,295 828,300 868,278 908,285 948,258 988,245" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M748,308 L788,295 L828,300 L868,278 L908,285 L948,258 L988,245 L988,320 L748,320 Z" fill="rgba(37,99,235,0.1)"/>

  <!-- Alert list -->
  <rect x="736" y="342" width="290" height="120" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="748" y="360" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#64748B">Varsler</text>
  <circle cx="748" cy="378" r="4" fill="#F59E0B"/>
  <text x="760" y="382" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#94A3B8">BJ-4421 nærmer seg kjøretidsgrense</text>
  <circle cx="748" cy="400" r="4" fill="#10B981"/>
  <text x="760" y="404" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#94A3B8">Faktura #4891 automatisk kontert</text>
  <circle cx="748" cy="422" r="4" fill="#EF4444"/>
  <text x="760" y="426" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#94A3B8">Vedlikehold forfaller: TK-2209</text>
  <circle cx="748" cy="444" r="4" fill="#2563EB"/>
  <text x="760" y="448" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#94A3B8">Rapport klar: August CO₂-data</text>

  <!-- Bottom subtle border -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accentGrad)" opacity="0.6"/>
</svg>
